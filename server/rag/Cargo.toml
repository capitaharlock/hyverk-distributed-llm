[package]
name = "hyverk-rag"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
anyhow = "1"

# Regex + text processing
regex = "1"
unicode-normalization = "0.1"

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }

# Path expansion (~)
shellexpand = "3"
