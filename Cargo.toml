[workspace]
members = [
    # Server
    "server/coordinator",
    "server/rag",
    "server/sandbox",
    # Client
    "client/node",
    "client/inference",
    "client/cli",
    # Shared
    "shared/proto",
    "shared/core",
    "shared/comms",
    "shared/training",
    "shared/synthesis",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", features = ["json"] }
