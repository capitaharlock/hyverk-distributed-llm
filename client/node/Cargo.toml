[package]
name = "hyverk-node"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hyverk-node"
path = "src/main.rs"

[dependencies]
hyverk-proto = { path = "../../shared/proto" }
hyverk-core = { path = "../../shared/core" }
hyverk-inference = { path = "../../client/inference" }
tokio = { workspace = true }
tokio-util = "0.7"
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
dirs = "5"
flate2 = "1"
hyverk-comms = { path = "../../shared/comms" }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
